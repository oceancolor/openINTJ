name: Release

# 打 tag（v0.3.0 等）时构建 Win/macOS/Linux 安装包并发布到 GitHub Release。
# electron-updater 从该 Release 拉取更新（latest.yml / latest-mac.yml / latest-linux.yml + 安装包）。
# 证书 secrets 未配置时产出未签名包；切勿把空 CSC_LINK 传给 electron-builder（会当成文件路径失败）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: ts
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: "--win"
          - os: macos-latest
            flag: "--mac"
          - os: ubuntu-latest
            flag: "--linux"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux AppImage deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2
        working-directory: .

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (incl. electron-vite bundle)
        run: pnpm exec turbo run build --concurrency=1

      - name: Align native module ABI to Electron
        working-directory: ts/apps/desktop
        run: node scripts/ensure-electron-abi.cjs

      - name: Package & publish
        working-directory: ts/apps/desktop
        env:
          # electron-builder 用 GH_TOKEN 上传安装包到 GitHub Release。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 空字符串也会被 electron-builder 当成 CSC_LINK 文件路径；先放进独立变量，非空再导出。
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          unset CSC_LINK CSC_KEY_PASSWORD || true

          if [ "${RUNNER_OS}" = "Windows" ] && [ -n "${WIN_CSC_LINK:-}" ]; then
            export CSC_LINK="${WIN_CSC_LINK}"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD:-}"
          elif [ "${RUNNER_OS}" = "macOS" ] && [ -n "${MAC_CSC_LINK:-}" ]; then
            export CSC_LINK="${MAC_CSC_LINK}"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
          fi

          EXTRA=()
          if [ "${RUNNER_OS}" = "macOS" ] && [ -n "${APPLE_ID:-}" ]; then
            EXTRA+=(--config.mac.notarize=true)
          fi

          pnpm exec electron-builder --config electron-builder.yml ${{ matrix.flag }} --publish always "${EXTRA[@]}"

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openintj-${{ matrix.os }}
          path: |
            ts/apps/desktop/release/*.exe
            ts/apps/desktop/release/*.dmg
            ts/apps/desktop/release/*.zip
            ts/apps/desktop/release/*.AppImage
            ts/apps/desktop/release/*.yml
          retention-days: 14
          if-no-files-found: ignore
