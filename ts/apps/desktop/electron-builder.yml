appId: ai.openintj.desktop
productName: OpenINTJ
copyright: Copyright (c) 2026 OpenINTJ
asar: true
# 原生模块（better-sqlite3 / lancedb / *.node）必须从 asar 解包，否则打包后运行时加载失败。
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@lancedb/**"
  - "**/node_modules/apache-arrow/**"
directories:
  buildResources: resources
  output: release
files:
  - "out/**/*"
  - "package.json"
  - "!node_modules/@openintj/**"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}"
extraMetadata:
  main: out/main/index.js
# 发布源：打包时据此生成 app-update.yml，供 electron-updater 拉取 GitHub Release。
# owner/repo 默认从 package.json 的 repository 字段推断；CI 上可用 GH_TOKEN 上传。
publish:
  provider: github
  owner: oceancolor
  repo: openINTJ
  releaseType: release
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: OpenINTJ-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: OpenINTJ
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # 默认关闭公证：缺 APPLE_ID 时 notarize:true 会让 CI 失败。
  # Release 工作流在检测到 Apple secrets 后会加 --config.mac.notarize=true。
  notarize: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Development
